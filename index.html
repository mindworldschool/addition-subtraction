<!DOCTYPE html>
<html lang="uk">
<head>
  <meta name="robots" content="noindex">
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DVHX3G2VJV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-DVHX3G2VJV', {
    'cookie_flags': 'SameSite=None;Secure'
  });
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MindWorld School — Додавання та віднімання</title>
  <!-- Общая оболочка публичных тренажёров: шапка, языки, шрифты, цвета -->
  <link rel="stylesheet" href="/trainer-shell/shell.v1.css" />
  <link rel="stylesheet" href="css/styles.css?v=3" />
  <script src="/trainer-shell/shell.v1.js"></script>
</head>

<body>
  <!-- Confetti overlay -->
  <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>

  <div class="app">
    <!-- Сюда оболочка вставит шапку (лого, название, UA / EN / RU / ES) -->
    <div id="mw-header"></div>

    <main class="content">
      <!-- Settings Panel -->
      <section class="panel" id="panel-settings" aria-labelledby="settings-title">
        <h2 id="settings-title" class="visually-hidden" data-i18n="settings">Налаштування</h2>
        <div class="settings-grid">
          <div class="field">
            <label for="level" data-i18n="level">Рівень</label>
            <select id="level">
              <option value="easy" data-i18n="level_easy">Легкий (≤10)</option>
              <option value="medium" data-i18n="level_medium">Середній (≤100 без переходу)</option>
              <option value="advanced" data-i18n="level_adv">Просунутий (≤100 з переходом)</option>
            </select>
          </div>
          <div class="field">
            <label for="mode" data-i18n="mode">Режим відповіді</label>
            <select id="mode">
              <option value="2" data-i18n="mode_2">2 варіанти</option>
              <option value="3" data-i18n="mode_3">3 варіанти</option>
              <option value="input" data-i18n="mode_input">Ввід відповіді</option>
            </select>
          </div>
          <div class="field">
            <label for="series" data-i18n="series">Серія</label>
            <select id="series">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="0" data-i18n="endless">Без обмежень</option>
            </select>
          </div>
          <div class="actions">
            <button id="btn-start" class="btn primary" data-i18n="start">Почати</button>
          </div>
        </div>
      </section>

      <!-- Game Panel: картинка класса с доской + карточка с ответами (как в кабинете) -->
      <section class="panel panel-game" id="panel-game" hidden aria-live="polite">
        <div class="play-layout">
          <div class="game-screen">
            <div class="board" aria-label="Task board">
              <div id="task" class="task">7 + 5 = ?</div>
            </div>
          </div>

          <div class="controls-card">
            <!-- Answer buttons (shown when mode = 2 or 3) -->
            <div id="answers" class="answers"></div>

            <!-- Input mode (shown ONLY when mode = input) -->
            <div id="inputWrap" class="input-wrap" hidden>
              <input
                id="answerInput"
                class="input"
                type="number"
                inputmode="numeric"
                pattern="[0-9]*"
                placeholder="?"
                aria-label="Введіть відповідь"
              />
              <button id="btn-submit" class="btn" data-i18n="submit">Відповісти</button>
            </div>

            <!-- Далі + звук -->
            <div class="toolbar">
              <button id="btn-next" class="btn" data-i18n="next">Далі</button>
              <button id="btn-sound" class="btn btn-sound" title="Звук" aria-label="Звук">🔊</button>
            </div>

            <!-- Счётчики -->
            <div class="stats" aria-live="polite">
              <span><span data-i18n="total">Всього</span> <b id="stat-total">0</b></span>
              <span><span data-i18n="correct">Вірно</span> <b id="stat-correct">0</b></span>
              <span><span data-i18n="wrong">Помилки</span> <b id="stat-wrong">0</b></span>
              <span><span data-i18n="streak">Серія</span> <b id="stat-streak">0</b></span>
            </div>

            <button id="btn-settings" class="btn ghost btn-exit" data-i18n="exit">Вихід</button>
          </div>
        </div>
      </section>
    </main>

    <!-- Toast notifications -->
    <div id="toast" class="toast" role="status" aria-live="assertive" aria-atomic="true"></div>
  </div>

  <!-- Шапка и язык — из общей оболочки: ?lang= → сохранённый выбор → браузер → украинский.
       Язык передаём в main.js через window.APP_LANG, смену — событием mw:langchange -->
  <script>
    MWShell.init({
      title: {
        uk: "Додавання та віднімання",
        en: "Addition & Subtraction",
        ru: "Сложение и вычитание",
        es: "Suma y resta"
      },
      tagline: {
        uk: "Рахуємо разом з левеням Лео",
        en: "Count together with Leo the lion cub",
        ru: "Считаем вместе со львёнком Лео",
        es: "Cuenta con el leoncito Leo"
      },
      docTitle: {
        uk: "Додавання та віднімання — MindWorld School",
        en: "Addition & Subtraction — MindWorld School",
        ru: "Сложение и вычитание — MindWorld School",
        es: "Suma y resta — MindWorld School"
      },
      onLangChange: function (lang) { window.APP_LANG = lang; }
    });
  </script>

  <!-- Scripts -->
  <script src="js/storage.js?v=2"></script>
  <script src="js/generator.js?v=2"></script>
  <script src="js/answers.js?v=2"></script>
  <script src="js/ui.js?v=2"></script>
  <script src="js/main.js?v=4"></script>
</body>

</html>
